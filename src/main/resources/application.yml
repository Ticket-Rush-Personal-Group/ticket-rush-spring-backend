spring:
  application:
    name: ticket-rush

  # 開發環境連共用的 ~/dev-databases(postgres:17 on 5432)。
  # 整合測試不走這裡 —— Testcontainers 的 @ServiceConnection 會覆蓋這組設定。
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_rush_db
    username: postgres
    # 密碼不寫死。值來自 ~/dev-databases/.env 的 POSTGRES_PASSWORD,見 .env.example
    password: ${DEV_DB_PASSWORD:}
    hikari:
      # 原本完全沒有設定，用的是預設值 10。
      #
      # 這個數字對需要鎖的策略是決定性的：悲觀鎖會延長交易，而交易期間連線被佔用。
      # 1000 併發下若只有 10 個連線，最多 10 個請求真的在等鎖，其餘 990 個在等連線——
      # 量到的會是排隊延遲而非鎖競爭，而兩者在延遲圖表上長得一模一樣。
      #
      # 50 遠低於資料庫的 max_connections=500（壓測環境），不會撞到資料庫端上限。
      # **此值必須納入壓測的測量條件**：它會影響所有策略的數據。
      maximum-pool-size: 50

  # 第 3 層（Redis 預扣）使用。開發環境連共用的 ~/dev-databases（redis:7 on 6379），
  # 與 postgres 同樣的處置：整合測試不走這裡——Testcontainers 的 @ServiceConnection 會覆蓋它。
  #
  # 刻意不設密碼：~/dev-databases 的 redis 未啟用認證。壓測環境用自己的容器，
  # 同樣在隔離網路內且不對外開埠。
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      # schema 由 Flyway 管理,Hibernate 不得插手。
      # validate:entity 與實際表結構不一致時,在啟動階段就失敗,而不是等到查詢才炸。
      ddl-auto: validate
    # 預設為 true 且會發出警告:它讓 Hibernate session 存活到 view 渲染完成,
    # 使延遲載入在不預期的地方觸發查詢。本專案的 domain 與 entity 分離,不需要這個行為。
    open-in-view: false

# 當前生效的併發策略。Phase 1 僅由此設定初始化;
# Phase 2 的管理介面才開放執行期切換(StrategyRegistry 以 volatile 持有)。
ticket-rush:
  strategy: noLock
  # 單人單場次的限購上限。不寫死在 domain：壓測時調整它會改變競爭形態——
  # 上限越低，被限購擋下的請求越多，真正進入鎖競爭的就越少。
  max-tickets-per-user: 4

  optimistic:
    # 樂觀鎖的重試上限。**此值必須納入壓測的測量條件**——
    # 它直接決定成交率與吞吐，上限 10 與上限 100 是兩組完全不同的系統行為，
    # 但在數據表上長得像同一個策略的兩次執行。
    #
    # 預設 100 的理由：1000 併發搶 500 張是極端競爭。上限太低會讓請求「重試耗盡」而失敗，
    # 售出就少於 500——那不是超賣，是本層特有的另一種失敗模式，但它會讓
    # 「售出恰好 500」的正確性驗收無法成立。驗收要保住「恰好」的力道，重試就得夠。
    #
    # 不寫死：壓測要在不改程式碼的情況下對照上限 100 與 10。
    max-attempts: 100

  redis:
    # 待落庫訂單的 Stream 與 consumer group（第 3 層）。
    #
    # 選 Stream 而非 List：Stream 有 consumer group、ack 與 pending 清單，
    # 消費者崩潰時訊息仍留在 pending 可被重新領取。若載體本身會無聲掉單，
    # 「對帳收斂」這個驗收就永遠不會成立，而那個不收斂是載體造成的、不是設計造成的——
    # 兩者混在一起就查不出來了。
    stream: orders
    consumer-group: order-persistence
    # 單一實例，名稱固定即可。多實例部署時每個實例必須有不同的名稱，
    # 否則兩個實例會共用同一份 pending 清單，互相「認領」對方尚未處理完的訊息。
    consumer-name: consumer-1
    # 週期對帳的間隔。**此值必須納入壓測的測量條件**——
    # 太長，收斂在壓測結束前看不到；太短，對帳本身成為負載。兩者都會改變本層的數字。
    #
    # 暫定 1 秒，取得第一組數據後再定案（見 design.md 的 Open Questions）。
    reconciliation-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health。env / configprops / heapdump 會洩漏設定與記憶體內容,
        # 而本專案之後要 public。第 4 支的 compose healthcheck 會打這個端點。
        include: health
